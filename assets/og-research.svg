<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Ephemerent Research — open journal</title>
  <desc id="desc">An archival provenance register showing submission, disclosed review, editorial decision, and immutable version.</desc>
  <rect width="1200" height="630" fill="#f6f2e9"/>
  <rect width="1200" height="13" fill="#355ad8"/>
  <path d="M74 74H1126M74 519H1126" stroke="#172039" stroke-width="2"/>
  <path d="M74 57V91M1126 57V91M74 502V536M1126 502V536" stroke="#dc624e" stroke-width="2"/>

  <text x="74" y="119" fill="#355ad8" font-family="Courier New, monospace" font-size="20" letter-spacing="1.5">EPHEMERENT RESEARCH</text>
  <text x="74" y="149" fill="#657087" font-family="Courier New, monospace" font-size="12" letter-spacing="1.2">OPEN JOURNAL  ·  EST. 2026</text>
  <text x="74" y="260" fill="#172039" font-family="Georgia, serif" font-size="66">Research without a</text>
  <text x="74" y="330" fill="#172039" font-family="Georgia, serif" font-size="66">credential gate.</text>
  <text x="77" y="390" fill="#657087" font-family="Georgia, serif" font-style="italic" font-size="25">AI may author. A person remains accountable.</text>

  <g transform="translate(704 120)">
    <rect width="422" height="332" fill="#f0ebdf" stroke="#172039" stroke-width="2"/>
    <text x="26" y="36" fill="#657087" font-family="Courier New, monospace" font-size="11" letter-spacing="1">PUBLIC PROVENANCE REGISTER / 001</text>
    <path d="M26 58H396" stroke="#b9bec7"/>
    <path d="M47 92V266" stroke="#355ad8" stroke-width="2"/>
    <g font-family="Courier New, monospace">
      <circle cx="47" cy="104" r="7" fill="#355ad8"/>
      <text x="70" y="108" fill="#172039" font-size="14">01  SUBMISSION</text>
      <text x="70" y="126" fill="#657087" font-size="10">ORIGINAL FILES · ACCOUNTABLE ACCOUNT</text>

      <circle cx="47" cy="160" r="7" fill="#7e5ac7"/>
      <text x="70" y="164" fill="#172039" font-size="14">02  DISCLOSED REVIEW</text>
      <text x="70" y="182" fill="#657087" font-size="10">MODE · MODEL · VERSION READ</text>

      <circle cx="47" cy="216" r="7" fill="#dc624e"/>
      <text x="70" y="220" fill="#172039" font-size="14">03  EDITORIAL DECISION</text>
      <text x="70" y="238" fill="#657087" font-size="10">REASONS RETAINED · HUMAN RESPONSIBILITY</text>

      <rect x="40" y="265" width="14" height="14" fill="#789846"/>
      <text x="70" y="277" fill="#172039" font-size="14">04  IMMUTABLE VERSION</text>
      <text x="70" y="295" fill="#657087" font-size="10">FILES · NOTICES · DISCUSSION ATTACHED</text>
    </g>
  </g>

  <text x="74" y="559" fill="#657087" font-family="Courier New, monospace" font-size="12" letter-spacing=".8">PEER-REVIEWED WITH AI · EDITORIALLY ACCOUNTABLE</text>
  <text x="1126" y="559" text-anchor="end" fill="#dc624e" font-family="Courier New, monospace" font-size="12">ER / OPEN RECORD</text>
</svg>
